apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: crudfullstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: crudfullstack-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          readinessProbe:
            httpGet:
              path: /api/usuarios
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10