apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  namespace: crudfullstack
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      initContainers:
        - name: fix-perms
          image: busybox:latest
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c", "chown -R 54321:54321 /opt/oracle/oradata && echo permisos ok"]
          volumeMounts:
            - name: oracle-data
              mountPath: /opt/oracle/oradata
      containers:
        - name: oracle
          image: gvenzl/oracle-xe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1521
              name: oracle-listener
          env:
            - name: ORACLE_PASSWORD
              value: tu_password
          readinessProbe:
            tcpSocket:
              port: 1521
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: oracle-data
              mountPath: /opt/oracle/oradata
  volumeClaimTemplates:
    - metadata:
        name: oracle-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: manual
        resources:
          requests:
            storage: 5Gi